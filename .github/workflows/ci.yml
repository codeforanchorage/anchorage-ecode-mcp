---
name: CI

# The Anchorage Municipal Code MCP server is deployed from main by hand
# (scripts/deploy.sh). This workflow is the check that main is deployable:
# lint, the full test suite, and an audit of what ships in the Lambda zip.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the requires-python floor; 3.14 is the Lambda runtime.
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with its dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Pinned to the 0.15 line, the one .pre-commit-config.yaml uses. The
      # dev extra only says ruff>=0.1.0, and a newer ruff enables more rules
      # by default and fails code that 0.15 passes.
      - name: Ruff lint
        run: |
          python -m pip install "ruff>=0.15,<0.16"
          ruff --version
          ruff check plugins/ tests/

      - name: Validate config.yaml
        run: >-
          python -c "from core.validators import load_and_validate_config;
          load_and_validate_config('config.yaml')"

      # Run both ways: the serial run catches state leaking between tests
      # in file order, the parallel run catches tests that only pass
      # because an earlier test in the same process set something up.
      - name: Tests, serial
        run: python -m pytest tests/ -q -p no:xdist -p no:cacheprovider

      - name: Tests, parallel, with coverage
        run: >-
          python -m pytest tests/ -q -n auto -p no:cacheprovider
          --cov=plugins --cov-report=term-missing --cov-fail-under=80

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Audits the runtime versions in uv.lock: exactly what scripts/deploy.sh
      # installs into the Lambda package. (It used to audit requirements.txt,
      # i.e. the newest versions, which stopped being what ships once the
      # deploy began installing from the lock.) --locked also fails the job
      # if uv.lock has drifted from pyproject.toml. opencontext-core is
      # installed from a git tag, is not on PyPI, and is reported as skipped.
      - name: pip-audit the locked Lambda dependencies
        run: |
          python -m pip install --upgrade pip pip-audit uv
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file locked-requirements.txt
          pip-audit -r locked-requirements.txt

  go-client:
    name: Go client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod

      - name: Vet and test
        working-directory: client
        run: |
          go vet ./...
          go test ./...
