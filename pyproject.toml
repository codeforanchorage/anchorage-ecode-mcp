[project]
name = "anchorage-ecode-mcp"
version = "1.1.0"
description = "MCP server for the Municipality of Anchorage municipal code, as published on eCode360"
# Started from OpenContext by Srihari Raman, City of Boston (see README).
authors = [
    {name = "Code for Anchorage"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Provides the `core` and `server` packages. Keep in step with
    # requirements.txt.
    "opencontext-core @ git+https://github.com/codeforanchorage/opencontext-core@v1.5.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "python-json-logger>=3.1.0",
    # read_attachment: text of the PDF tables the code publishes.
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    # scripts/local_server.py only; not in the Lambda package.
    "aiohttp>=3.8.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.1.0",
    "pip-audit>=2.0.0",
    # A declared outputSchema is binding -- the spec says servers MUST
    # conform and clients SHOULD validate -- so the tests validate real tool
    # output against the declared schema rather than eyeballing the shape.
    "jsonschema>=4.0.0",
    # Ad hoc CloudWatch log analysis; not in the Lambda package.
    "boto3>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/codeforanchorage/anchorage-ecode-mcp"
Documentation = "https://github.com/codeforanchorage/anchorage-ecode-mcp/blob/main/docs/GETTING_STARTED.md"
Repository = "https://github.com/codeforanchorage/anchorage-ecode-mcp"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plugins*", "custom_plugins*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "code_date: let get_section / get_sections look up the code's last-updated date (off by default in tests)",
    "outline_sections: let a section number be resolved from the table of contents before search (off by default in tests)",
    "ordinance_titles: let find_ordinance / recent_ordinances read ordinance titles from their PDFs (off by default in tests; the test must mock the download)",
]

[tool.coverage.run]
# Exclude hard-to-test modules from coverage (formatters, integration-heavy plugin code)
omit = [
    "*/tests/*",
]
