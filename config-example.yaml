# Configuration template
# ======================
#
# This repo's live configuration is config.yaml (the Anchorage Municipal Code
# MCP server). Use this template when deploying a copy for a different
# eCode360 library:
#   cp config-example.yaml config.yaml
#
# IMPORTANT: enable ONLY ONE plugin per fork/deployment.
# OpenContext enforces: One Fork = One MCP Server.
# To deploy another MCP server, fork the repository again.
#
# Values are NOT expanded: "${ENV_VAR}" reaches the plugin as that literal
# string. Never put a secret in this file; it is packaged into the Lambda zip.
#
# See docs/GETTING_STARTED.md and docs/BUILT_IN_PLUGINS.md.

---
# Server metadata
server_name: "Your Municipality Municipal Code MCP"
server_version: "1.0.0"
description: "Read-only access to your municipality's code on eCode360: search, browse, and read sections."
organization: "Your Municipality"

# Optional guidance returned to MCP clients when they connect. See config.yaml
# for a full example that steers the model to cite sections.
# instructions: |
#   You are connected to the municipal code of ...

plugins:
  # eCode360 municipal code (General Code)
  ecode:
    enabled: true
    base_url: "https://api.ecode360.com"
    customer_id: "XX0000" # your eCode360 library ID, e.g. "AN6998"
    city_name: "Your Municipality"
    # Per-upstream-request HTTP timeout, seconds. Keep below lambda_timeout.
    timeout: 20
    # NAMES of the environment variables holding the credentials, not values.
    api_key_env: "ECODE_API_KEY"
    api_secret_env: "ECODE_API_SECRET"
    # Local dev only: a gitignored KEY=VALUE file loaded at startup.
    # secrets_file: ".ecode.env"

  # yamllint disable rule:comments-indentation
  # Custom: add your own plugin here (see docs/CUSTOM_PLUGINS.md) and disable
  # the one above.
  # my_custom_plugin:
  #   enabled: false
  #   api_endpoint: "https://api.example.com"
  # yamllint enable rule:comments-indentation

# AWS deployment settings
aws:
  region: "us-west-2"
  lambda_name: "your-ecode-mcp"
  # Memory also sets the CPU share; PDF text extraction is CPU-bound.
  lambda_memory: 1024
  # Must stay under the 29s API Gateway integration timeout.
  lambda_timeout: 28

# Logging configuration
logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR
  format: "json" # json or text
