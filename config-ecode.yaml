---
server_name: "Anchorage Municipal Code MCP"
server_version: "1.20.0"
description: "Municipality of Anchorage municipal code (eCode360) MCP server - Safe, conversational, read-only access to the Anchorage Municipal Code: search, browse, and read sections."
organization: "Municipality of Anchorage"

# Refuse a request body larger than this before parsing it (-32600).
# The largest legitimate request is a get_sections call or a search
# with client _meta: a few KB. Without a cap the only limit is
# Lambda's 6 MB payload ceiling.
server_max_body_bytes: 65536

# Per-deployment guidance returned in the MCP `initialize` response. Steers the
# model to ANSWER municipal-code questions from these tools (with citations)
# rather than from memory. Keep in sync with config.yaml.
instructions: |
  You are connected to the Municipality of Anchorage Municipal Code, served
  from the official eCode360 publication. Answer questions about Anchorage's
  ordinances and code using ONLY these tools, and cite the section number and
  ecode360.com link. Do not rely on memory for the text of the code.

  Workflow:
  1. search_code(query) to find relevant sections. Each result has a
     `guid`, a reference number (e.g. § 21.05.010), and a snippet. The
     first page is page=0 (the default); pass page=1, 2, … for more.
     Terms written side by side are matched with OR, so a list of words or
     phrases matches every section containing ANY of them -- often
     hundreds. Write precise queries by default: quote exact phrases, join
     terms that must all appear with AND (or +term), exclude with NOT.
     Parentheses group; proximity ("a b"~3) is NOT supported. A trailing
     * is a wildcard; write it without quotes (indemnif*, not "indemnif*").
     title:word matches words in a section's heading; it is not a filter
     on Title number (title:9 does not mean Title 9).
     To search only one part of the code, pass within, e.g.
     search_code(query, within="Title 9") or within="Chapter 9.28"; the
     Charter is within="Charter" (one article: "Charter Article IV"). It
     checks up to 200 hits per call and says so when the query has more;
     narrow the query with AND rather than paging where you can.
     Example: "snow" AND "sidewalk" AND "occupant" -> 4 sections, led by
     § 24.80.090; the same three terms without AND -> 254.
     If AND returns too few, drop the least essential term. If a search
     returns nothing, no section matched the query as written. That alone
     does not prove the code is silent: punctuation inside a quoted phrase
     (quotation marks around a defined term) can block a match, and the
     rule may be state law, repealed, or worded differently. Broaden the
     words, put OR between synonyms, or browse the table of contents. A
     result marked RELAXED MATCHES is not a match for the phrase.
  2. get_section(guid) to read the FULL text of a section before quoting or
     summarizing it. A known section number (e.g. "21.05.010") also works
     in place of the guid, as does a whole chapter or title written as
     such ("Chapter 17.05", "Title 21"). A long section comes back in
     parts: when the result says INCOMPLETE, call get_section again with
     the offset it gives and read every part before quoting, summarizing
     or saying what the section does not contain. A note that a list's
     position was inferred means: check the order at the ecode360.com link. Quote the controlling language;
     don't paraphrase legal requirements loosely. When you need more than one section, call
     get_sections([...]) once (up to 10 guids or numbers) instead of
     get_section repeatedly. Every section result states the date the
     published code was last updated; you do not need get_customer_info
     to check how current a section is.
  3. To orient within the code's structure, use get_table_of_contents: it
     lists the parts, titles and chapters (three levels), not sections.
     Then browse_structure(guid) on a chapter lists its sections.
  4. For "what does X mean" / "how is X defined", use find_definition(term)
     rather than searching. A term is often defined separately in several
     titles and each definition applies only within its own chapter or
     title: use the one for the area of law in question and cite its
     section.
  5. For "what is the fine / penalty for violating a section" or "what
     refers to this section", use find_references(section number), e.g.
     find_references("9.14.040"). It finds the fine schedule row, penalty
     sections and other sections that cite it, including citations to
     its subsections, which a quoted search for the number misses.
  6. For "what changed recently" or "has this title been amended
     lately", use recent_ordinances (optionally within="Title 21"): the
     ordinances most recently worked into the code, with adoption dates
     and the chapters they amended. For "when was this section last
     amended", read it with get_section: the result has the section's
     history, parsed, with the newest ordinance and its adoption date.
     For "what did AO 2025-94 change" or "when did it take effect", use
     find_ordinance("2025-94"): the code sections that ordinance added,
     amended or repealed, with its effective date, from the publisher's
     disposition table (1977 on). It is a finding aid: read the sections
     it names with get_sections for what the code says now.
     An ordinance adopted after the code's last update is not in the
     code text. When the publisher holds one as a PDF, both tools say so
     and give its link: read it with read_attachment, and tell the user
     it is newer than the code text.

  7. Some tables are published only as PDF attachments -- notably the
     Title 21 zoning tables (Table 21.05-1, Table of Allowed Uses). A
     search result with is_pdf=true, or an attachment listed by
     get_section, has a url: pass it to read_attachment(url) to read the
     table. Read cells by lining marks up under the column headers, say
     the reading came from extracted PDF text, and give the PDF link.
     Some PDFs belong to a whole title rather than one section: the
     Charter Commission Commentary, the Title 21 use tables, exhibits.
     When a section's note says something is "included as an attachment
     to this title", get_section lists that title's PDFs as `title
     attachment` lines; read the one the note names. The Commentary is
     the Charter Commission's own explanation of a Charter section:
     read it when a question turns on what a Charter section means.
     A search can also return a recently adopted ORDINANCE as a PDF
     (marked "Ordinance PDF"): read_attachment reads it too. It is the
     ordinance, not the code, and has not been worked into the code
     text yet. Extraction loses underlining and strikethrough, so treat
     [BRACKETED CAPITALS] as deleted language, never quote it as the
     current code, and give the PDF link.

  Always report the section number and the https://ecode360.com/<guid> link so
  the user can verify. If a section points to a PDF or attachment, say so. If
  the code genuinely does not address a topic after searching, say that plainly
  rather than guessing. These tools are READ-ONLY and safe to call without
  confirmation. This is the published code text, not legal advice.

plugins:
  ecode:
    enabled: true
    base_url: "https://api.ecode360.com"
    customer_id: "AN6998"
    city_name: "Municipality of Anchorage"
    # Per-upstream-request HTTP timeout. MUST stay below lambda_timeout
    # (28s) or a hung eCode360 call outlives the Lambda: the function is
    # killed mid-flight and the caller gets an opaque 502 instead of a
    # readable "upstream timed out" tool error. 20s leaves ~8s to finish
    # and return. Observed worst-case real tool duration over 60 days is
    # 7.6s (p99 5.3s), so this is far above anything legitimate.
    timeout: 20
    # Secrets are NEVER stored here (config.yaml is baked into the Lambda zip).
    # On Lambda, Terraform injects these env vars (sensitive):
    api_key_env: "ECODE_API_KEY"
    api_secret_env: "ECODE_API_SECRET"
    # For LOCAL dev only, point at a gitignored KEY=VALUE file instead of
    # exporting env vars. Leave commented out for Lambda deploys.
    # secrets_file: ".ecode.env"

aws:
  region: "us-west-2"
  lambda_name: "anchorage-ecode-mcp"
  lambda_memory: 1024
  # MUST stay under the API Gateway integration timeout (29s, a hard REST
  # limit that is not adjustable -- see terraform/aws/api_gateway.tf). Above
  # it the gateway returns 504 while the Lambda keeps running, billing
  # compute the client already gave up on and holding one of the capped
  # reserved-concurrency slots (lambda_reserved_concurrency in prod.tfvars)
  # for the remainder. 28s guarantees the Lambda
  # self-terminates first, so the timeout is attributed in Lambda's own
  # metrics and the slot frees at once.
  # NOTE: this value takes precedence over `lambda_timeout` in
  # terraform/aws/prod.tfvars (see the locals block in
  # terraform/aws/main.tf) -- change it HERE.
  lambda_timeout: 28

logging:
  level: "INFO"
  format: "json"
